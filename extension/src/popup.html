<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tamescroll</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<!-- One calm screen: the site you are on, one switch, two rows. Bring
     back and Settings are one tap away and one level deep. Night only
     (his call, 2026-11-23). -->
<div id="view-home" class="view">
  <header class="bar">
    <span class="brand">
      <svg class="mark" viewBox="0 0 34 24" aria-hidden="true"><path d="M17 11a2.3 2.3 0 0 0-4.6 0a4.6 4.6 0 0 0 9.2 0a6.9 6.9 0 0 0-13.8 0a9.2 9.2 0 0 0 9.2 9.2l13.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="brand-name">tamescroll</span>
    </span>
    <button class="icon-btn" id="open-settings" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></svg>
    </button>
  </header>

  <section class="site">
    <div class="site-line">
      <h1 id="site-name"></h1>
      <span id="site-switch"></span>
    </div>
    <p class="site-status" id="site-status"></p>
  </section>

  <div class="rows" id="site-rows">
    <button class="row" type="button" id="open-parts">
      <span class="row-label">Bring back</span>
      <span class="row-value" id="parts-value"></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
    <div class="row">
      <span class="row-label">Blur pictures</span>
      <span id="blur-switch"></span>
    </div>
  </div>

  <div id="reload-note" class="notice" hidden>
    <span>Reload the page to finish.</span>
    <button id="reload" class="text-btn" type="button">Reload</button>
  </div>
</div>

<div id="view-parts" class="view" hidden>
  <header class="bar">
    <button class="icon-btn back" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="bar-title" id="parts-title">Bring back</span>
    <span class="bar-spacer"></span>
  </header>
  <p class="hint">Everything starts hidden. Switch on only what you want back.</p>
  <div class="rows" id="parts"></div>
</div>

<div id="view-settings" class="view" hidden>
  <header class="bar">
    <button class="icon-btn back" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="bar-title">Settings</span>
    <span class="bar-spacer"></span>
  </header>
  <div class="label">Sites</div>
  <div class="rows" id="sites"></div>
  <div class="label">Blur strength</div>
  <div class="seg" id="strength"></div>
  <div class="about">
    <span id="version"></span>
    <button class="text-btn" id="check-rules" type="button">Check for filter updates</button>
  </div>
  <p class="foot" id="rules-status"></p>
</div>
<script src="popup.js"></script>
</body>
</html>

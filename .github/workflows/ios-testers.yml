name: iOS TestFlight testers

# Hands the newest TestFlight build to every external tester group (the
# public link) and submits it for Apple's beta review, so testers are
# always on the latest build (.github/scripts/testflight-testers.py).
# Runs after every TestFlight upload, or on its own from a commit with
# [testers] in its message. Linux runner: it only talks to Apple's API.

on:
  workflow_call:
    inputs:
      build:
        description: Build number to wait for (the TestFlight run number)
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  testers:
    name: Give the newest build to testers
    if: >
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[testers]') ||
      contains(github.event.head_commit.message, '[testflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: API key on disk
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" > "$KEY"
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Add to tester groups and submit for review
        run: python3 .github/scripts/testflight-testers.py app.tamescroll.client --wait-minutes 35 ${BUILD:+--build "$BUILD"}
        env:
          BUILD: ${{ inputs.build }}

      - name: What Apple has now
        if: always()
        run: python3 .github/scripts/testflight-testers.py app.tamescroll.client --status

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

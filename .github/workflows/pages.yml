# Publishes web/ (the site, privacy policy and terms) to GitHub Pages, so
# Play Console has a public privacy-policy URL. Settings -> Pages: Source
# GitHub Actions, custom domain tamescroll.com (DNS: four A records to
# 185.199.108-111.153, www CNAME tamescroll.github.io), Enforce HTTPS.
# Then: https://tamescroll.com/privacy.html
name: Site

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs: deploy-pages run in the same job
  # as upload-pages-artifact lists the artifacts before they are visible
  # and fails with "No artifacts named github-pages" (actions/deploy-pages#451;
  # every deploy since 2026-11-24).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings flow mockups</title>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('look') === 'paper') document.documentElement.dataset.look = 'paper';
</script>
<script type="module">
  import "@fontsource/inter/400.css"; import "@fontsource/inter/500.css"; import "@fontsource/inter/600.css";
  import "@fontsource/spectral/400.css"; import "@fontsource/spectral/500.css";
  import "/src/styles.css";
  const s = new URLSearchParams(location.search).get('s') || 'sites';
  document.querySelector('#app').innerHTML = document.querySelector('#t-' + s).innerHTML;
  const place = () => document.querySelectorAll('.seg').forEach((seg) => {
    const th = seg.querySelector('.seg-thumb'), on = seg.querySelector('.seg-opt.active');
    if (th && on) { th.style.opacity = 1; th.style.width = on.offsetWidth + 'px'; th.style.transform = `translateX(${on.offsetLeft}px)`; }
  });
  requestAnimationFrame(() => requestAnimationFrame(place));
  setTimeout(place, 400);
  // tour mock: cut the hole around the real element, put the card beside it
  const holes = () => document.querySelectorAll('.hole[data-for]').forEach((h) => {
    const r = document.querySelector(h.dataset.for).getBoundingClientRect(), pad = 4;
    Object.assign(h.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px', right: 'auto', bottom: 'auto' });
    const c = h.parentElement.querySelector('.ccard');
    if (c.dataset.side === 'above') c.style.bottom = innerHeight - r.top + 22 + 'px'; else c.style.top = r.bottom + 22 + 'px';
  });
  setTimeout(holes, 300);
</script>
<style>
  body { background: var(--bg); }
  #app { min-height: 100vh; }
  .scr { padding: 0 16px 32px; max-width: 600px; margin: 0 auto; }
  svg.i { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* top bar: round back, centred title */
  .tb { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 14px 0 8px; }
  .tb .rb { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--elev); border: 1px solid var(--hairline); color: var(--ink); }
  .tb .rb svg { width: 20px; height: 20px; }
  .tb .tt { text-align: center; font-weight: 600; font-size: var(--t-base); }
  html[data-look="paper"] .tb .rb { background: #fff; box-shadow: var(--shadow); }

  .big { font-family: var(--font-display); font-weight: 500; font-size: 32px; letter-spacing: -0.3px; line-height: 1.1; margin: 10px 4px 18px; }
  .lab { font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 22px 4px 8px; }
  .foot { color: var(--faint); font-size: var(--t-sm); line-height: 1.45; margin: 8px 4px 0; }
  .g { margin: 0; }
  .g .row { min-height: 62px; }
  .val { color: var(--muted); }
  .row .end { color: var(--faint); font-size: var(--t-sm); white-space: nowrap; margin-right: 2px; }
  .row-ic.solid { background: #141414; }
  .row-ic.solid .mark { stroke: #f2e8d5; }
  .glyph { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; font-family: var(--font-display); font-size: 18px; background: var(--row-ic); color: var(--ink); }

  /* "finish setup" notice on Settings home */
  .todo { display: flex; gap: 12px; align-items: center; padding: 14px 14px 14px 16px; border-radius: 16px; background: color-mix(in srgb, var(--gold) 12%, var(--elev)); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); margin-bottom: 4px; }
  .todo .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); flex: none; }
  .todo .ic svg { width: 18px; height: 18px; }
  .todo b { display: block; font-size: var(--t-md); font-weight: 600; }
  .todo span { display: block; font-size: var(--t-sm); color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .todo .btn-solid { min-height: 38px; padding: 0 16px; font-size: var(--t-sm); flex: none; }

  /* site page header */
  .site-head { display: flex; gap: 14px; align-items: center; margin: 8px 4px 6px; }
  .site-head .glyph { width: 52px; height: 52px; border-radius: 15px; font-size: 26px; }
  .site-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.1; }
  .site-head p { color: var(--muted); font-size: var(--t-sm); margin-top: 3px; }
  .hint { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--row-ic); color: var(--muted); font-size: var(--t-sm); line-height: 1.4; margin: 14px 0 0; }
  .hint svg { width: 18px; height: 18px; flex: none; }
  .g .row.sw { min-height: 54px; }
  .g .row.sw .row-title { font-weight: 500; }
  .danger .row-title { color: #d98a7a; }
  html[data-look="paper"] .danger .row-title { color: #b2442f; }

  /* words, folded into Blur */
  .chips2 { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 16px 4px; }
  .chip2 { display: inline-flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-radius: 999px; background: var(--row-ic); font-size: var(--t-md); }
  .chip2 svg { width: 14px; height: 14px; color: var(--faint); }
  .addw { display: flex; gap: 8px; padding: 10px 16px 16px; }
  .addw .f { flex: 1; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); display: flex; align-items: center; padding: 0 14px; color: var(--faint); font-size: var(--t-md); }
  .addw .btn-solid { min-height: 46px; padding: 0 18px; }

  /* home, the bar and the menu sheet */
  .ntp { min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  .ntp .wm { display: flex; align-items: center; gap: 8px; padding: 18px 4px 0; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
  .ntp .wm svg { width: 22px; height: 17px; }
  .ntp .wm .mark { stroke: var(--ink); }
  .ntp h1 { font-family: var(--font-display); font-weight: 500; font-size: 32px; margin: 34px 4px 26px; }
  .favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 8px; }
  .fav { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--muted); }
  .fav .glyph { width: 56px; height: 56px; border-radius: 17px; font-size: 24px; background: var(--elev); border: 1px solid var(--hairline); }
  html[data-look="paper"] .fav .glyph { background: #fff; box-shadow: var(--shadow); }
  .fav.add .glyph { border-style: dashed; color: var(--faint); font-family: var(--font-ui); font-size: 22px; background: transparent; box-shadow: none; }
  .nbar { margin-top: auto; display: flex; gap: 8px; align-items: center; padding: 10px 0 14px; }
  .nbar .addr { flex: 1; min-height: 48px; border-radius: 14px; background: var(--elev); border: 1px solid var(--hairline); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--faint); font-size: var(--t-md); }
  html[data-look="paper"] .nbar .addr { background: #fff; box-shadow: var(--shadow); }
  .nbar .addr svg { width: 18px; height: 18px; }
  .nbar .ib { width: 44px; height: 48px; display: grid; place-items: center; color: var(--ink); }
  .nbar .ib svg { width: 22px; height: 22px; }
  .tabsn { width: 22px; height: 22px; border: 1.7px solid currentColor; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 600; }

  .dim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; }
  html[data-look="paper"] .dim { background: rgba(30,25,15,.35); }
  .msheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--sheet, var(--surface)); border-radius: 22px 22px 0 0; padding: 10px 14px 18px; }
  html[data-look="paper"] .msheet { background: #fbfaf7; }
  .msheet .grab { display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
  .mtiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .mtile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 4px 12px; border-radius: 14px; background: var(--elev); border: 1px solid var(--hairline); font-size: var(--t-sm); color: var(--ink); }
  html[data-look="paper"] .mtile { background: #fff; }
  .mtile svg { width: 22px; height: 22px; }
  .msheet .group { margin: 0; }
  .msheet .row { min-height: 54px; }
  .msheet .row-ic { width: 34px; height: 34px; }
  .here { display: flex; gap: 12px; align-items: center; padding: 4px 4px 14px; }
  .here .glyph { width: 44px; height: 44px; font-size: 22px; border-radius: 13px; }
  .here b { display: block; font-size: var(--t-base); font-weight: 600; }
  .here span { display: block; font-size: var(--t-sm); color: var(--muted); margin-top: 2px; }
  .here .btn-ghost { margin-left: auto; min-height: 38px; padding: 0 14px; font-size: var(--t-sm); }
  .tog { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); opacity: .8; }

  .site-page { min-height: 100vh; background: #f3f1ec; padding: 64px 16px 0; }
  .site-page i { display: block; height: 14px; border-radius: 7px; background: #dedad2; margin-bottom: 12px; }
  .site-page i.b { height: 180px; border-radius: 12px; margin: 22px 0; }
  .site-top { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: #fff; border-bottom: 1px solid #e6e2da; }

  /* library */
  .libseg { margin: 6px 0 14px; }
  .star { width: 22px; height: 22px; color: var(--gold); }
  .star.off { color: var(--faint); }

  /* tour */
  .coach2 { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
  .hole { position: absolute; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0,0,0,.62); }
  html[data-look="paper"] .hole { box-shadow: 0 0 0 9999px rgba(30,25,15,.45); }
  .hole::after { content: ""; position: absolute; inset: -6px; border-radius: 22px; border: 1.5px solid rgba(236,231,222,.55); }
  .ccard { position: absolute; left: 16px; right: 16px; padding: 16px 18px 14px; border-radius: 20px; background: #1f1e1c; border: 1px solid rgba(236,231,222,.1); }
  html[data-look="paper"] .ccard { background: #fbfaf7; border-color: rgba(0,0,0,.08); }
  .ccard .top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .ccard .cic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(236,231,222,.08); color: var(--ink); }
  html[data-look="paper"] .ccard .cic { background: rgba(0,0,0,.05); }
  .ccard .cic svg { width: 20px; height: 20px; }
  .ccard .dots { display: flex; gap: 5px; flex: 1; }
  .ccard .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(236,231,222,.2); }
  html[data-look="paper"] .ccard .dots i { background: rgba(0,0,0,.15); }
  .ccard .dots i.p { background: rgba(236,231,222,.45); }
  html[data-look="paper"] .ccard .dots i.p { background: rgba(0,0,0,.35); }
  .ccard .dots i.n, html[data-look="paper"] .ccard .dots i.n { width: 18px; background: var(--ink); }
  .ccard .skip { color: var(--faint); font-size: var(--t-sm); }
  .ccard h3 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0 0 4px; color: var(--ink); }
  .ccard p { color: var(--muted); font-size: var(--t-md); line-height: 1.45; margin: 0; }
  .ccard .act { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: var(--t-sm); }
  .ccard .act .bk { color: var(--muted); }
  .ccard .act .nx { color: var(--faint); }
  .ccard .act .btn-solid { min-height: 40px; padding: 0 18px; font-size: var(--t-sm); }
  /* About: the header is centred and carries the version and update state */
  .ab-head { text-align: center; padding: 18px 0 20px; }
  .ab-mark { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; background: var(--row-ic); }
  .ab-mark svg { width: 38px; height: 30px; }
  .ab-mark .mark { stroke: #f2e8d5; }
  .ab-mark { background: #0e0e0d; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  html[data-look="paper"] .ab-mark { background: #141414; box-shadow: 0 6px 16px -8px rgba(0,0,0,.45); }
  .ab-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.1; letter-spacing: -0.3px; }
  .ab-head .tag { color: var(--muted); font-size: var(--t-base); margin-top: 6px; }
  .ab-ver { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 7px 12px 7px 10px; border-radius: 999px; background: var(--row-ic); font-size: var(--t-sm); color: var(--muted); }
  .ab-ver svg { width: 15px; height: 15px; fill: none; stroke: var(--green); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ab-ver b { color: var(--ink); font-weight: 600; }
  .ab-ver.new { background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--ink); }

  /* The promise: three plain facts, no taps, no jargon */
  .promise { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 22px; }
  .promise div { padding: 14px 10px 12px; border-radius: 14px; background: var(--elev); border: 1px solid var(--hairline); text-align: center; }
  .promise svg { width: 22px; height: 22px; display: block; margin: 0 auto 8px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .promise b { display: block; font-size: var(--t-md); font-weight: 600; line-height: 1.25; }
  .promise span { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 3px; }
  html[data-look="paper"] .promise div { box-shadow: var(--shadow); }

  .ab-label { font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; margin: 0 4px 8px; }
  .ab-group { margin-bottom: 22px; }
  .ab-group .row { min-height: 60px; }
  .row-end { color: var(--faint); font-size: var(--t-sm); margin-right: 2px; }
  .ab-foot { text-align: center; color: var(--faint); font-size: var(--t-sm); line-height: 1.5; padding: 4px 0 28px; }


  .settings-nav { padding: 4px; }
  .settings-nav .nav-item { flex: 1 1 0; padding: 0 2px; }
  .pane-in { padding-top: 6px; }
  .intro { color: var(--muted); font-size: var(--t-base); line-height: 1.45; margin: 4px 4px 16px; }
  .row .row-sub.k { color: var(--faint); }
  .sitecard .row { min-height: 66px; }
  .sitecard .glyph { width: 40px; height: 40px; font-size: 20px; border-radius: 12px; }
</style>
</head>
<body>
<main id="app"></main>

<template id="t-sites">
  <section id="view-settings">
    <div class="settings-top"><header class="bar"><button class="back-btn"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button><span class="bar-title">Settings</span><span class="bar-spacer"></span></header><nav class="settings-nav seg"><span class="seg-thumb"></span><button class="nav-item seg-opt active" id="tab-sites">Sites</button><button class="nav-item seg-opt" id="tab-blur">Blur</button><button class="nav-item seg-opt" id="tab-look">Look</button><button class="nav-item seg-opt" id="tab-about">About</button></nav></div>
    <div class="settings-body"><div class="panes"><section class="pane pane-in">
      <p class="intro">Feeds and endless videos start hidden on these sites. Tap one to bring back the parts you want.</p>
      <section class="group g sitecard">
        <button class="row row-btn"><span class="glyph">Y</span><span class="grow"><span class="row-title">YouTube</span><span class="row-sub">All feeds hidden</span></span><svg class="row-chev" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
        <button class="row row-btn"><span class="glyph">R</span><span class="grow"><span class="row-title">Reddit</span><span class="row-sub">1 part back on</span></span><svg class="row-chev" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
        <button class="row row-btn"><span class="row-ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="grow"><span class="row-title">Tame another site</span></span><svg class="row-chev" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
      </section>
      <p class="lab">Finish setting up</p>
      <div class="todo"><span class="ic"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><div class="grow"><b>YouTube links</b><span>Still open in the YouTube app. Takes a minute.</span></div><button class="btn-solid">Set up</button></div>
      <p class="lab">On every site</p>
      <section class="group g">
        <div class="row"><span class="row-ic"><svg viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span><span class="grow"><span class="row-title">Sign-in and app-install nags</span><span class="row-sub">Always hidden</span></span></div>
      </section>
    </section></div></div>
  </section>
</template>
<template id="t-site">
  <section id="view-settings">
    <div class="settings-top"><header class="bar"><button class="back-btn"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button><span class="bar-title">Sites</span><span class="bar-spacer"></span></header></div>
    <div class="settings-body"><div class="panes"><section class="pane pane-in">
      <div class="site-head"><span class="glyph">Y</span><div><h2>YouTube</h2><p>All feeds hidden. Search, subscriptions and the video you pick work as normal.</p></div></div>
      <div class="hint"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 12h3M17.5 12h3"/><rect x="6.5" y="8" width="11" height="8" rx="4"/><circle cx="10.5" cy="12" r="2.2"/></svg>Off means hidden. Switch a part on to bring it back.</div>
      <p class="lab">On the home page</p>
      <section class="group g">
        <label class="row sw"><span class="grow"><span class="row-title">Home feed</span><span class="row-sub k">The endless grid when YouTube opens</span></span><button class="switch" role="switch" aria-checked="false"></button></label>
        <label class="row sw"><span class="grow"><span class="row-title">Shorts</span><span class="row-sub k">Short videos you swipe through</span></span><button class="switch" role="switch" aria-checked="false"></button></label>
        <label class="row sw"><span class="grow"><span class="row-title">Topic chips</span><span class="row-sub k">The row of topics at the top</span></span><button class="switch" role="switch" aria-checked="false"></button></label>
      </section>
      <p class="lab">While watching</p>
      <section class="group g">
        <label class="row sw"><span class="grow"><span class="row-title">Recommendations</span><span class="row-sub k">More videos under the one you're watching</span></span><button class="switch" role="switch" aria-checked="false"></button></label>
        <label class="row sw"><span class="grow"><span class="row-title">Autoplay next video</span><span class="row-sub k">Starts another video when one ends</span></span><button class="switch" role="switch" aria-checked="false"></button></label>
        <label class="row sw"><span class="grow"><span class="row-title">Next and previous buttons</span><span class="row-sub k">The skip arrows on the player</span></span><button class="switch" role="switch" aria-checked="false"></button></label>
        <label class="row sw"><span class="grow"><span class="row-title">Swiping between videos</span><span class="row-sub k">Swipe up on a video to get another</span></span><button class="switch" role="switch" aria-checked="false"></button></label>
      </section>
      <section class="group g danger" style="margin-top:22px">
        <button class="row row-btn"><span class="grow row-title">Stop taming YouTube</span></button>
      </section>
    </section></div></div>
  </section>
</template>
<template id="t-blur">
  <section id="view-settings">
    <div class="settings-top"><header class="bar"><button class="back-btn"><svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button><span class="bar-title">Settings</span><span class="bar-spacer"></span></header><nav class="settings-nav seg"><span class="seg-thumb"></span><button class="nav-item seg-opt" id="tab-sites">Sites</button><button class="nav-item seg-opt active" id="tab-blur">Blur</button><button class="nav-item seg-opt" id="tab-look">Look</button><button class="nav-item seg-opt" id="tab-about">About</button></nav></div>
    <div class="settings-body"><div class="panes"><section class="pane pane-in">
      <div class="pane-stage bs blur-hero" data-show="women" style="--bpx:9px">
